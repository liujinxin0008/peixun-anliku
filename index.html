// ====== 进度管理 ======
function loadProgress(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):{}}catch(e){return{}}}
function saveProgress(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function updateProgress(compId,pct){const s=loadProgress();if(pct>(s[compId]||0)){s[compId]=pct;saveProgress(s)}}

// ====== 分类与 Tabs ======
const categories=['角色认知与目标规划','绩效推进与沟通','人才识别与授权','员工辅导与发展','管理执行力','团队问题分析与解决'];
const catIcons={'角色认知与目标规划':'💡','绩效推进与沟通':'💬','人才识别与授权':'🔑','员工辅导与发展':'🌱','管理执行力':'⚡','团队问题分析与解决':'🔍'};

function buildTabs(){
  const tabsEl=document.getElementById('tabs');
  tabsEl.innerHTML=`<div class="tab${activeCategory==='all'?' active':''}" onclick="setCategory('all')">全部案例</div>`+
    categories.map(c=>`<div class="tab${activeCategory===c?' active':''}" onclick="setCategory('${c}')">${catIcons[c]} ${c}</div>`).join('');
}
function setCategory(cat){activeCategory=cat;buildTabs();renderCaseCards()}

// ====== 统计（含悬浮提示） ======
function renderStats(){
  const saved=loadProgress();
  const detailRows=competencies.map(c=>{
    const pct=saved[c.id]||0;
    return `<div class="bar-wrap"><span>${c.icon}</span><span style="width:90px;font-size:0.8em">${c.title.substring(0,6)}</span><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span style="font-size:0.85em;min-width:32px">${pct}%</span></div>`;
  }).join('');
  const mastered=competencies.filter(c=>(saved[c.id]||0)>=80).length;
  const avg=competencies.length>0?Math.round(competencies.reduce((s,c)=>s+(saved[c.id]||0),0)/competencies.length):0;

  document.getElementById('stats').innerHTML=`
    <div class="stat-card"><div class="num">${caseLibrary.length}</div><div class="label">实战案例</div></div>
    <div class="stat-card"><div class="num">${competencies.length}</div><div class="label">方法论体系</div></div>
    <div class="stat-card"><div class="num">${mastered}/${competencies.length}</div><div class="label">已掌握(≥80%)</div>
      <div class="stat-tip"><strong>掌握度明细</strong>${detailRows}</div></div>
    <div class="stat-card"><div class="num">${avg}%</div><div class="label">综合掌握度</div>
      <div class="stat-tip"><strong>综合掌握度</strong>${detailRows}</div></div>`;
}

// ====== 案例卡片渲染 ======
const catClassMap={'角色认知与目标规划':'cat-role','绩效推进与沟通':'cat-perf','人才识别与授权':'cat-talent','员工辅导与发展':'cat-coach','管理执行力':'cat-exec','团队问题分析与解决':'cat-problem'};
function renderCaseCards(){
  const query=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  let filtered=activeCategory==='all'?caseLibrary:caseLibrary.filter(c=>c.category===activeCategory);
  if(query)filtered=filtered.filter(c=>c.title.toLowerCase().includes(query)||c.sections.some(s=>s.body.toLowerCase().includes(query))||c.category.includes(query));

  const grid=document.getElementById('cardGrid');
  if(!filtered.length){grid.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><p>没有找到匹配的案例，试试换个关键词</p><p style="font-size:0.85em;margin-top:6px">可搜索：问题关键词 / 能力项名称 / 场景描述</p></div>';return;}

  grid.innerHTML=filtered.map((c,i)=>`
    <div class="case-card ${catClassMap[c.category]||''}" style="animation-delay:${i*0.04}s" onclick="openCase(${c.id})">
      <div class="card-head"><span class="badge">${catIcons[c.category]} ${c.category}</span></div>
      <h3>${c.title}</h3>
      <div class="scenario">${c.sections[0].body.replace(/<[^>]*>/g,'').substring(0,100)}...</div>
      <div class="card-foot"><span>📖 ${(c.sections.find(s=>s.type==='methodology')||{}).title.replace('背后方法论：','')||'相关能力项'}</span><span>📝 ${(c.questionIds||[]).length}题</span></div>
    </div>`).join('');

  renderStats();
}

// ====== 案例详情弹窗 ======
function openCase(caseId){
  const c=caseLibrary.find(x=>x.id===caseId);if(!c)return;
  const saved=loadProgress();const mastery=saved[c.competencyId]||0;
  const modules=c.sections.map((s,i)=>{
    const clsMap={scene:'mod-scene',diagnosis:'mod-diagnosis',solution:'mod-solution',scripts:'mod-scripts',case:'mod-case',methodology:'mod-methodology',quiz:'mod-quiz'};
    const isOpen=i===0?' open':'';
    const title=s.type==='methodology'?s.title.replace('背后方法论：','相关能力项：'):s.title;
    return `<div class="module ${clsMap[s.type]||''}${isOpen}"><div class="module-head" onclick="toggleModule(this)"><span>${title}</span><span class="mod-arrow">▼</span></div><div class="module-body"><div class="module-inner">${s.body}</div></div></div>`;
  }).join('');

  document.getElementById('modal').innerHTML=`
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="bread"><span class="badge" style="font-size:0.8em">${catIcons[c.category]} ${c.category}</span> 当前掌握度 <strong>${mastery}%</strong></div>
      <h2>${c.title}</h2>
    </div>
    <div class="modal-body">${modules}
      <div class="btn-row"><button class="btn btn-primary" onclick="startQuiz(${c.competencyId})">📝 开始自测</button><button class="btn btn-secondary" onclick="closeModal()">返回案例库</button></div>
    </div>`;
  document.getElementById('modalOverlay').style.display='flex';
}

function toggleModule(head){head.parentElement.classList.toggle('open')}
function closeOrConfirm(){if(quizState){confirmQuitQuiz()}else closeModal()}
function closeModal(){document.getElementById('modalOverlay').style.display='none';}

// ====== 自测模式 ======
function startQuiz(compId){
  const pool=questionBank.filter(q=>caseLibrary.some(c=>c.competencyId===compId&&(c.questionIds||[]).includes(q.id)));
  const shuffled=[...pool].sort(()=>Math.random()-0.5);
  const selected=shuffled.slice(0,Math.min(3,shuffled.length));
  if(!selected.length){alert('该能力暂无考题');return;}
  quizState={compId,questions:selected,currentIndex:0,answers:[],correctCount:0,autoTimer:null};
  renderQuizQuestion();
}

function renderQuizQuestion(){
  if(!quizState)return;
  const total=quizState.questions.length,idx=quizState.currentIndex,q=quizState.questions[idx];
  let dots='';for(let i=0;i<total;i++){let cls='';if(i<idx)cls=quizState.answers[i]===quizState.questions[i].answer?'correct':'wrong';else if(i===idx)cls='current';dots+=`<div class="quiz-dot ${cls}"></div>`}

  document.getElementById('modal').innerHTML=`
    <div class="modal-head"><button class="modal-close" onclick="confirmQuitQuiz()">✕</button><div class="bread">📝 自测模式 — 题目 ${idx+1}/${total}</div><h2 style="font-size:1.05em">${q.stem}</h2></div>
    <div class="modal-body"><div class="quiz-progress">${dots}</div>
      <div class="quiz-opts" id="quizOptions">${q.options.map((opt,oi)=>`<div class="quiz-opt" data-index="${oi}" onclick="selectAnswer(${oi})" tabindex="0">${String.fromCharCode(65+oi)}. ${opt}</div>`).join('')}</div>
      <div id="quizFeedback"></div>
      <div class="btn-row"><button class="btn btn-secondary" id="btnNext" style="display:none" onclick="nextQuestion()">下一题 ▶</button></div></div>`;
  document.addEventListener('keydown',quizKeyHandler);
}

function quizKeyHandler(e){if(!quizState||quizState.answered)return;const k=e.key.toUpperCase(),m={'A':0,'B':1,'C':2,'D':3};if(m[k]!==undefined&&m[k]<quizState.questions[quizState.currentIndex].options.length)selectAnswer(m[k])}

function selectAnswer(idx){
  if(!quizState||quizState.answered)return;quizState.answered=true;
  const q=quizState.questions[quizState.currentIndex],isCorrect=idx===q.answer;
  if(isCorrect)quizState.correctCount++;quizState.answers.push(idx);
  if(quizState.autoTimer)clearTimeout(quizState.autoTimer);
  const opts=document.querySelectorAll('.quiz-opt');opts.forEach(o=>o.style.pointerEvents='none');
  opts[idx].classList.add(isCorrect?'correct':'wrong');if(!isCorrect)opts[q.answer].classList.add('correct');
  document.getElementById('quizFeedback').innerHTML=`<div class="quiz-fb ${isCorrect?'ok':'ng'}"><strong>${isCorrect?'✅ 正确！':'❌ 错误'}</strong><br>${q.explanation}</div>`;
  document.getElementById('btnNext').style.display='inline-block';document.getElementById('btnNext').focus();
  quizState.autoTimer=setTimeout(()=>nextQuestion(),2000);
}

function nextQuestion(){if(!quizState)return;if(quizState.autoTimer)clearTimeout(quizState.autoTimer);quizState.answered=false;quizState.currentIndex++;if(quizState.currentIndex>=quizState.questions.length)showQuizResult();else renderQuizQuestion()}

function confirmQuitQuiz(){if(quizState&&quizState.answers.length>0&&quizState.answers.length<quizState.questions.length){if(!confirm('确定退出？当前进度将不会保存。'))return}const compId=quizState?quizState.compId:null;quizState=null;document.removeEventListener('keydown',quizKeyHandler);if(compId){const c=caseLibrary.find(x=>x.competencyId===compId);if(c)openCase(c.id);else closeModal()}else closeModal()}

function showQuizResult(){
  if(!quizState)return;document.removeEventListener('keydown',quizKeyHandler);
  const total=quizState.questions.length,correct=quizState.correctCount,pct=Math.round(correct/total*100);
  updateProgress(quizState.compId,pct);
  let ec='',et='';if(pct>=80){ec='great';et='🎉 已掌握！对这项能力理解扎实，继续保持并应用于实践。'}else if(pct>=50){ec='ok';et='📖 还需巩固！建议回顾案例中的处理流程和方法论，针对薄弱点加强学习。'}else{ec='poor';et='💪 建议重学！核心概念需要系统复习，建议仔细阅读案例拆解和方法论后再来挑战。'}
  const wrongList=quizState.questions.filter((q,i)=>quizState.answers[i]!==q.answer);
  let rv='';if(wrongList.length)rv=`<div style="text-align:left;margin-top:18px"><h4 style="margin-bottom:10px;color:#e74c3c">📌 错题回顾</h4>${wrongList.map((q,wi)=>{const ai=quizState.answers[quizState.questions.indexOf(q)];return`<div class="review-item"><div><strong>${wi+1}. ${q.stem}</strong></div><div>你的选择：<span class="wrong-ans">${q.options[ai]}</span></div><div>正确答案：<span class="right-ans">${q.options[q.answer]}</span></div><div class="explain">💡 ${q.explanation}</div></div>`}).join('')}</div>`;
  document.getElementById('modal').innerHTML=`<div class="modal-head"><button class="modal-close" onclick="closeModal()">✕</button><h2>📊 自测结果</h2></div><div class="modal-body"><div class="result-wrap"><div class="result-score">${correct}/${total}</div><div style="color:#888;margin:6px 0">正确率 ${pct}%</div><div class="result-eval ${ec}">${et}</div>${rv}<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" onclick="startQuiz(${quizState.compId})">🔄 再来一次</button><button class="btn btn-secondary" onclick="closeModal()">返回案例库</button></div></div></div>`;quizState=null;renderCaseCards();
}

function resetProgress(){if(confirm('确定要重置所有学习进度吗？此操作不可恢复。')){localStorage.removeItem(STORAGE_KEY);renderCaseCards()}}

// ====== 初始化 ======
buildTabs();renderCaseCards();
document.getElementById('searchInput').addEventListener('input',renderCaseCards);
</script>
</body>
</html>
