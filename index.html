<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训主任工具箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#f0f4ff 0%,#e8f0fe 30%,#f5f6fa 60%,#fef9e7 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.container{max-width:640px;width:100%;text-align:center}
.hero-icon{font-size:3em;margin-bottom:12px;display:block}
h1{font-size:2em;font-weight:800;background:linear-gradient(135deg,#2c3e50,#4A90E2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{color:#666;font-size:0.95em;margin-bottom:36px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border-radius:12px;padding:28px 20px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.05);transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;align-items:center;gap:10px}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.card-icon{font-size:2.8em}
.card h2{font-size:1.1em;color:#2c3e50}
.card p{font-size:0.82em;color:#888;line-height:1.6}
.card.case{border-top:3px solid #27ae60}
.card.kanban{border-top:3px solid #4A90E2}
.footer{margin-top:36px;color:#bbb;font-size:0.78em}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <span class="hero-icon">🛠️</span>
  <h1>培训主任工具箱</h1>
  <p class="subtitle">选择你要使用的工具</p>
  <div class="cards">
    <a href="anliku/" class="card case">
      <span class="card-icon">📚</span>
      <h2>实战案例库</h2>
      <p>29个真实管理场景<br>六大能力板块 + 自测模式</p>
    </a>
    <a href="kanban/" class="card kanban">
      <span class="card-icon">📊</span>
      <h2>人才评估看板</h2>
      <p>HR数据看板<br>员工画像 + 人才九宫格</p>
    </a>
  </div>
  <div class="footer">培训主任培养方案 · 内部工具</div>
</div>
</body>
</html>
