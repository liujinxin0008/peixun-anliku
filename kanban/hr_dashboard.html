<body>
<div class="hr-container" id="app">
    <div class="loading">加载数据中...</div>
</div>

<script>
    // 注册 datalabels 插件
    Chart.register(ChartDataLabels);
    // 全局配置显示数据标签
    Chart.defaults.set('plugins.datalabels', {
        color: '#0f172a',
        anchor: 'end',
        align: 'top',
        offset: 4,
        font: { weight: 'bold', size: 11 }
    });

    let globalData = null;

    // 获取最新月份
    function getLatestMonth(snapshots) {
        const months = [...new Set(snapshots.map(s => s.month))];
        months.sort();
        return months[months.length - 1];
    }

    // 根据城市筛选快照
    function filterSnapshotsByCity(snapshots, city, month) {
        return snapshots.filter(s => s.month === month && (city === 'all' || s.city === city));
    }

    // 渲染 KPI
    function renderKPIs(snapshots, city, latestMonth) {
        const filtered = filterSnapshotsByCity(snapshots, city, latestMonth);
        const total = filtered.length;
        const formal = filtered.filter(s => s.status === '主任').length;
        const intern = filtered.filter(s => s.status === '见习主任').length;
        document.getElementById('kpiCards').innerHTML = `
            <div class="kpi-card"><div class="kpi-label"><i class="fas fa-users"></i> 总主任人数</div><div class="kpi-number">${total}</div></div>
            <div class="kpi-card"><div class="kpi-label"><i class="fas fa-user-check"></i> 转正主任</div><div class="kpi-number">${formal}</div></div>
            <div class="kpi-card"><div class="kpi-label"><i class="fas fa-user-graduate"></i> 见习主任</div><div class="kpi-number">${intern}</div></div>
        `;
    }

    // 获取历史趋势 (每月每城市总人数)
    function getTrendData(snapshots, city) {
        const months = [...new Set(snapshots.map(s => s.month))].sort();
        const trend = months.map(month => {
            const filtered = snapshots.filter(s => s.month === month && (city === 'all' || s.city === city));
            return filtered.length;
        });
        return { months, trend };
    }

    // 渲染折线图
    let trendChart = null;
    function renderTrendChart(snapshots, city) {
        const { months, trend } = getTrendData(snapshots, city);
        const ctx = document.getElementById('trendChart').getContext('2d');
        if (trendChart) trendChart.destroy();
        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: city === 'all' ? '全城团队总人数' : `${city}团队人数`,
                    data: trend,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59,130,246,0.05)',
                    borderWidth: 3,
                    pointRadius: 4,
                    pointBackgroundColor: '#1e40af',
                    tension: 0.2,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    tooltip: { callbacks: { label: (ctx) => `${ctx.raw} 人` } },
                    datalabels: { align: 'top', offset: 6, formatter: (value) => value }
                },
                scales: { y: { beginAtZero: true, title: { display: true, text: '人数' } } }
            }
        });
    }

    // 渲染各城市见习 vs 转正柱状图
    let cityCompareChart = null;
    function renderCityCompareChart(snapshots, selectedCity, latestMonth) {
        const ctx = document.getElementById('cityCompareChart').getContext('2d');
        if (cityCompareChart) cityCompareChart.destroy();

        if (selectedCity === 'all') {
            const cities = [...new Set(snapshots.filter(s => s.month === latestMonth).map(s => s.city))];
            const formalData = cities.map(c => snapshots.filter(s => s.month === latestMonth && s.city === c && s.status === '主任').length);
            const internData = cities.map(c => snapshots.filter(s => s.month === latestMonth && s.city === c && s.status === '见习主任').length);
            cityCompareChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: cities,
                    datasets: [
                        { label: '转正主任', data: formalData, backgroundColor: '#2c7da0', borderRadius: 8 },
                        { label: '见习主任', data: internData, backgroundColor: '#ffb74d', borderRadius: 8 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { datalabels: { anchor: 'center', align: 'center', formatter: (value) => value } },
                    scales: { y: { beginAtZero: true, title: { display: true, text: '人数' } } }
                }
            });
        } else {
            const formal = snapshots.filter(s => s.month === latestMonth && s.city === selectedCity && s.status === '主任').length;
            const intern = snapshots.filter(s => s.month === latestMonth && s.city === selectedCity && s.status === '见习主任').length;
            cityCompareChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['转正主任', '见习主任'],
                    datasets: [{ label: '人数', data: [formal, intern], backgroundColor: ['#2c7da0', '#ffb74d'], borderRadius: 8 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { datalabels: { anchor: 'end', align: 'top', formatter: (value) => value } },
                    scales: { y: { beginAtZero: true, title: { display: true, text: '人数' } } }
                }
            });
        }
    }

    // 在岗时长饼图
    let tenurePieChart = null;
    function renderTenurePieChart(snapshots, selectedCity, latestMonth) {
        let filtered = snapshots.filter(s => s.month === latestMonth);
        if (selectedCity !== 'all') filtered = filtered.filter(s => s.city === selectedCity);
        const groups = { "<6个月": 0, "6-12个月": 0, "1-2年": 0, "2年以上": 0 };
        // 以最新月份最后一天为基准
        const [yr, mo] = latestMonth.split('-').map(Number);
        const refDate = new Date(yr, mo, 0);
        filtered.forEach(emp => {
            if (!emp.promotion_date) return;
            const promoDate = new Date(emp.promotion_date);
            const diffDays = (refDate - promoDate) / (1000 * 60 * 60 * 24);
            if (diffDays < 180) groups["<6个月"]++;
            else if (diffDays < 365) groups["6-12个月"]++;
            else if (diffDays < 730) groups["1-2年"]++;
            else groups["2年以上"]++;
        });
        const ctx = document.getElementById('tenurePieChart').getContext('2d');
        if (tenurePieChart) tenurePieChart.destroy();
        tenurePieChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: Object.keys(groups),
                datasets: [{ data: Object.values(groups), backgroundColor: ['#3b82f6', '#f97316', '#10b981', '#8b5cf6'] }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right', labels: { boxWidth: 14, padding: 16, font: { size: 13 } } },
                    datalabels: { formatter: (value, ctx) => { let total = ctx.dataset.data.reduce((a,b)=>a+b,0); let pct = ((value/total)*100).toFixed(1); return `${value} (${pct}%)`; }, color: '#fff', anchor: 'center', align: 'center', font: { weight: 'bold' } }
                }
            }
        });
    }

    // 渲染人力更新明细
    function renderEventList(changes, selectedCity) {
        let filtered = changes;
        if (selectedCity !== 'all') filtered = changes.filter(c => c.city === selectedCity);
        filtered.sort((a,b) => new Date(b.month) - new Date(a.month));
        const container = document.getElementById('eventListContainer');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">暂无近期人力动态</div>';
            return;
        }
        container.innerHTML = filtered.slice(0, 8).map(ev => `
            <div class="event-item">
                <div><strong>${ev.name}</strong> · <span style="color:#64748b;font-size:12px;">${ev.city || ''}</span>${ev.remark ? ' · ' + ev.remark : ''}</div>
                <div><span class="event-type ${ev.change_type}">${ev.change_type}</span> <span class="badge-date">${ev.month}</span></div>
            </div>
        `).join('');
    }

    // 全局刷新
    function refreshAll(snapshots, changes, selectedCity, latestMonth) {
        renderKPIs(snapshots, selectedCity, latestMonth);
        renderTrendChart(snapshots, selectedCity);
        renderCityCompareChart(snapshots, selectedCity, latestMonth);
        renderTenurePieChart(snapshots, selectedCity, latestMonth);
        renderEventList(changes, selectedCity);
    }

    // 加载数据并初始化
    async function loadData() {
        try {
            const json = __DATA__; // 数据已内嵌，无需 fetch
            globalData = json;
            const snapshots = json.snapshots;
            const changes = json.changes.map(c => ({ ...c, city: c.city || (snapshots.find(s => s.employee_id === c.employee_id)?.city || '未知') })); // 确保变动有城市字段
            const latestMonth = getLatestMonth(snapshots);
            const cities = [...new Set(snapshots.map(s => s.city))];
            // 构建界面
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-chart-line"></i> 团队规模 & 人力动态<span style="font-size:12px;font-weight:400;color:#94a3b8;margin-left:10px;">*数据来源：观远花名册数据</span></div>
                        <select id="cityMainSelect" class="filter-select">
                            <option value="all">🌍 全部城市</option>
                            ${cities.map(c => `<option value="${c}">🏙️ ${c}</option>`).join('')}
                        </select>
                    </div>
                    <div class="kpi-row" id="kpiCards"></div>
                    <div class="split-row">
                        <div class="split-left">
                            <div style="font-weight: 600; margin-bottom: 10px;"><i class="fas fa-chart-simple"></i> 团队规模变化趋势（近6个月）</div>
                            <div class="chart-container"><canvas id="trendChart"></canvas></div>
                        </div>
                        <div class="split-right">
                            <div style="font-weight: 600; margin-bottom: 10px;"><i class="fas fa-clock"></i> 近期人力更新明细</div>
                            <div id="eventListContainer" class="event-list"></div>
                        </div>
                    </div>
                </div>
                <div class="split-row">
                    <div class="split-left">
                        <div class="card" style="height: 100%;">
                            <div class="card-header"><div class="card-title"><i class="fas fa-chart-column"></i> 各城市见习主任 vs 转正主任</div></div>
                            <div style="height: 300px;"><canvas id="cityCompareChart"></canvas></div>
                        </div>
                    </div>
                    <div class="split-right">
                        <div class="card" style="height: 100%;">
                            <div class="card-header"><div class="card-title"><i class="fas fa-chart-pie"></i> 上任时长分布</div></div>
                            <div style="height: 300px; position: relative;"><canvas id="tenurePieChart"></canvas></div>
                        </div>
                    </div>
                </div>
            `;
            // 初始化渲染
            refreshAll(snapshots, changes, 'all', latestMonth);
            // 绑定城市切换事件
            const citySelect = document.getElementById('cityMainSelect');
            citySelect.addEventListener('change', (e) => {
                refreshAll(snapshots, changes, e.target.value, latestMonth);
            });
        } catch (err) {
            document.getElementById('app').innerHTML = `<div class="loading" style="color:red;">数据加载失败: ${err.message}<br>请确保 data.json 文件存在且格式正确</div>`;
        }
    }
    loadData();
</script>
